# 銀行からのお知らせ・お願い・メンテナンス（あとでキャンペーン）。ふつうの ActiveRecord（イベントソーシングにしない）
#   - 利用者の画面: /notices（一覧・本文）。ねこが吹き出しで知らせる部品を利用者画面に差し込む。利用者のログイン（packs/customer_identity）
#   - 行員の画面（/admin/notices）は別のパック packs/notices_admin（行員のログイン）。このパックの公開 API だけを使う
#   - 対象の利用者は顧客台帳（packs/customer_registry）の Customer
#
# 外から使ってよいのは app/public にあるものだけ:
#   - Notices::InboxHelper … 利用者画面のレイアウトで notices_inbox を呼ぶと、メニューのバッジとねこの吹き出しが入る。
#                            画面のパックのベースコントローラで helper Notices::InboxHelper する
#   - Notices::Board       … お知らせを出す・直す・掲載を終える唯一の入口（行員の画面と、あとでキャンペーンのパックが使う）
#   - Notice               … お知らせ（読み取り。行員の一覧・フォームで使う。書き込みは Board から）
# 既読（NoticeReceipt）・対象（NoticeTarget）・ジョブ・画面は非公開
enforce_dependencies: true
enforce_privacy: true

dependencies:
  - packs/platform
  - packs/customer_identity
  - packs/customer_registry
  - packs/ui
