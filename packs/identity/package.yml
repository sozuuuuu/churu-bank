# 利用者と認証: User / Session / ログイン画面（Rails 8 の generate authentication がもと）と、
# 利用者と口座のひも付け（AccountOwnership）。銀行パックは User を知らない（口座番号だけでつなぐ）
#
# 外から使ってよいのは app/public にあるものだけ:
#   - Authentication … コントローラに include するログイン必須の concern（AdminConstraint もここ）
#   - Current        … いまのリクエストのセッションと利用者
#   - User           … 利用者（admin? / account_numbers / grant_account）
enforce_dependencies: true
enforce_privacy: true

dependencies:
  - packs/platform
