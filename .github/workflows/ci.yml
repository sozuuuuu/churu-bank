# push と pull request のたびに bin/ci（rubocop・packwerk・gem と importmap の監査・brakeman・試験・seed）を回す。
# ローカルと同じ bin/ci を使うので、ここに手順を二重に書かない（config/ci.rb が手順の正）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Ruby の版は mise.toml と同じ
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true

      - name: bin/ci
        run: bin/ci
