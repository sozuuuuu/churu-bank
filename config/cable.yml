# 開発でも Solid Cable を使う。Solid Queue のジョブやコンソール、MCP など
# Web 以外のプロセスから broadcast しても、ブラウザに届くようにするため。
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
  writer_batch_size: 4
  writer_batch_delay: 0.001.seconds
